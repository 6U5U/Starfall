name: Apex Lab CI
on:
  push:
    paths:
      - "apex-lab/**"
      - ".github/workflows/apex-lab-ci.yml"
  pull_request:
    paths:
      - "apex-lab/**"
      - ".github/workflows/apex-lab-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
